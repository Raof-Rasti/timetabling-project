<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>سامانه هوشمند زمان‌بندی</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ================== THEME VARIABLES ================== */
/* DARK (default) */
:root {
  --bg: #020617;
  --bg-app: radial-gradient(circle at top, #1e293b, #020617);
  --card: #111827;
  --soft: #1f2937;
  --border: #273449;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --primary: #38bdf8;
  --primary-btn: linear-gradient(135deg, #38bdf8, #22d3ee);
  --btn-text: #020617;
  --danger: #f87171;
}

/* LIGHT */
#theme-toggle:checked ~ .app {
  --bg: #f5f7fb;
  --bg-app: #f5f7fb;
  --card: #ffffff;
  --soft: #f1f5f9;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #2563eb;
  --primary-btn: #2563eb;
  --btn-text: #ffffff;
  --danger: #dc2626;
}

/* ================== BASE ================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Vazirmatn', sans-serif;
}

#theme-toggle { display: none; }

.app {
  min-height: 100vh;
  background: var(--bg-app);
  color: var(--text);
  transition: background .3s ease, color .3s ease;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px 20px;
}

/* ================== HEADER ================== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

header h1 {
  font-size: 1.8rem;
  color: var(--primary);
  margin: 0;
}

.subtitle {
  font-size: 0.9rem;
  color: var(--muted);
}

.theme-switch {
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--muted);
}

/* ================== CARD ================== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 26px;
  margin-bottom: 28px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

.upload-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

input[type="file"] {
  width: 100%;
  max-width: 420px;
  padding: 12px;
  border-radius: 12px;
  border: 1px dashed var(--border);
  background: var(--soft);
  color: var(--muted);
}

/* ================== BUTTON ================== */
button {
  background: var(--primary-btn);
  color: var(--btn-text);
  border: none;
  border-radius: 14px;
  padding: 12px 32px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(37,99,235,0.35);
}

/* ================== TABLE ================== */
.table-wrapper {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 26px;
  position: relative;
}

.table-title {
  padding: 14px 18px;
  background: var(--soft);
  color: var(--primary);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

th {
  background: var(--soft);
  color: var(--text);
  padding: 11px;
  border-bottom: 1px solid var(--border);
}

td {
  padding: 10px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  white-space: nowrap;
}

tbody tr:nth-child(even) {
  background: rgba(0,0,0,0.02);
}

/* ================== PAYWALL BLUR ================== */
.blur {
  position: relative;
}

.blur td {
  filter: blur(10px) grayscale(100%);
  opacity: 0.2;
}

.blur::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--bg);
  opacity: 0.8;
  z-index: 1;
}

.blur::after {
  content: "🔒 برای مشاهده کامل اشتراک تهیه کنید";
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--danger);
  pointer-events: none;
}

/* ================== FOOTER ================== */
footer {
  margin-top: 40px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}
</style>
</head>

<body>

<input type="checkbox" id="theme-toggle">

<div class="app">
  <div class="container">

    <header>
      <button onclick="logout()" style="font-size:.8rem">
  خروج
</button>
      <div>
        <h1>📅 سامانه هوشمند زمان‌بندی</h1>
        <div class="subtitle">نمایش برنامه کلاس‌ها و اساتید</div>
      </div>

      <label for="theme-toggle" class="theme-switch">
        🌙 دارک / لایت ☀️
      </label>
    </header>

    <div class="card upload-box">
      <input type="file" id="file_excel" accept=".xlsx" />
      <button onclick="send()">🚀 اجرای زمان‌بند</button>
    </div>

    <div id="results"></div>

    <footer>
      Raof Rasti • Smart Timetabling System
    </footer>

  </div>
</div>

<script src="script.js"></script>
<script src="auth.js"></script>
<script>
  requireAuth();
</script>
<script src="script.js"></script>

</body>
</html>
